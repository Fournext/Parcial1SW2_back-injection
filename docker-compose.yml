services:
  db:
    image: postgres:16-alpine
    container_name: ai_discovery_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_discovery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ai_discovery_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "True"
      DJANGO_ENV: "development"
      SECRET_KEY: "django-insecure-docker-dev-secret-key-12345"
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/ai_discovery"
      ALLOWED_TARGET_HOSTS: "localhost,127.0.0.1,web,host.docker.internal"
      PLAYWRIGHT_HEADLESS: "True"
      DISCOVERY_TIMEOUT_SECONDS: "30"
      MAX_CAPTURED_REQUESTS: "500"
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
